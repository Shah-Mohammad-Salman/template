<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template</title>
    <link rel="stylesheet" href="style.css">

    <!-- Cleaned up Google Font Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
</head>

<body>
    <div class="main-container">
        <header>
            <div class="navbar">
                <div class="logo">
                    <h1>Hello</h1>
                </div>
                <div class="nav-list">
                    <ul>
                        <li class="home-blue">Home</li>
                        <li>Pricing</li>
                        <li>About us</li>
                        <li>Contact</li>
                    </ul>
                </div>
                <div class="auth-btn">
                    <a class="log-in" href="">Log in</a>
                    <a class="sign-up" href="">Sign up</a>
                </div>
            </div>
        </header>
        <main>
            <div class="main-body">
                <div class="sub-body-1">
                    <span>- FREE 30 DAY TRIAL</span>
                    <h2>The best way to showcase your project</h2>
                    <p>Here you can put a short description about your project.</p>
                    <div class="btns">
                        <button id="btn-1">Try for free</button>
                        <button id="btn-2">See how it works</button>
                    </div>
                </div>
                <div class="sub-body-2">
                    <span>
                        <img src="image_e095cb6f.jpg"
                            alt="3D abstract blue and orange pillars holding a smartphone mockup" width="450px"
                            height="500px">
                    </span>
                </div>
            </div>
        </main>
        <footer>
            <p>Trusted by individuals and teams at the world's
            <br>best companies</p>
            <span>
                <img src="Screenshot 2026-09-06 111422.png" alt="slack's logo" width="100px" height="50px">
                <img src="Screenshot 2026-09-06 111428.png" alt="microsoft's logo" width="100px" height="40px">
                <img src="Screenshot 2026-09-06 111433.png" alt="apple's logo" width="45px" height="45px">
                <img src="Screenshot 2026-09-06 111441.png" alt="paypal's logo" width="65px" height="50px">
                <img src="Screenshot 2026-09-06 111447.png" alt="amazon's logo" width="65px" height="50px">
            </span>
        </footer>
    </div>
</body>

</html>
